global
    log /dev/log local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    # Long timeouts: kubectl logs -f / exec / watch hold connections open
    timeout client  1h
    timeout server  1h

frontend kubernetes-api
    bind *:6443
    default_backend kubernetes-api-backend

backend kubernetes-api-backend
    mode tcp
    balance roundrobin
    # Health check = the API server's real readiness endpoint (anonymous access allowed by default)
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server master1 10.31.8.41:6443 check check-ssl verify none
    server master2 10.31.8.42:6443 check check-ssl verify none
    server master3 10.31.8.43:6443 check check-ssl verify none

# Stats page on localhost only. View it through an SSH tunnel:
#   ssh -L 8404:127.0.0.1:8404 user@loadbalancer   then open http://localhost:8404/
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
