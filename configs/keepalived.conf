# /etc/keepalived/keepalived.conf  (OPTIONAL: for an HA pair of load balancers)
#
# Per node, change:
#   state     -> MASTER on loadbalancer1, BACKUP on loadbalancer2
#   priority  -> 101 on loadbalancer1,    100 on loadbalancer2
#   interface -> your NIC name (check with: ip -br link)
#   auth_pass -> a shared secret (max 8 chars); do NOT commit the real one
#   VIP       -> a free address on the node subnet (10.31.8.50 here)

global_defs {
    router_id LB_HA
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep haproxy"
    interval 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance K8S_API {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CHANGEME
    }

    virtual_ipaddress {
        10.31.8.50/24
    }

    track_script {
        chk_haproxy
    }
}
