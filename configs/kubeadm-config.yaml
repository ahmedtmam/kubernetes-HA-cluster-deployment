# Usage (on master1):
#   sudo kubeadm init --config configs/kubeadm-config.yaml --upload-certs
#
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
clusterName: ha-lab
# Load balancer address (or the Keepalived VIP / a DNS name that points at it)
controlPlaneEndpoint: "10.31.8.47:6443"
networking:
  podSubnet: 10.244.0.0/16        # must match CALICO_IPV4POOL_CIDR
  serviceSubnet: 10.96.0.0/12
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd              # must match containerd SystemdCgroup = true